# Local development — full stack (app + infrastructure, standalone Redis, no TLS/Sentinel)
#
# Prerequisites:
#   1. Copy your pip credentials:
#        cp compose/secrets/pip.example.conf compose/secrets/pip.conf
#        # then fill in USERNAME and PASSWORD in pip.conf
#   2. Copy and fill your env:
#        cp .env.example .env
#        # ensure REDIS_USE_SENTINEL=False and DJANGO_SETTINGS_MODULE=config.settings.local
#
# Usage (run from project root):
#   docker compose -f compose_local/docker-compose.local.yml up --build
#
# Services:
#   api          → http://localhost:8000   (runserver, hot-reload via volume mounts)
#   celery       → background task worker
#   celery-beat  → periodic task scheduler
#   postgres     → localhost:5432
#   redis        → localhost:6379
#   elasticsearch → localhost:9200 (security disabled)
#   redisinsight → http://localhost:5540

x-app-base: &app-base
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      DJANGO_ENV: dev
    secrets:
      - pip_conf
  env_file:
    - ../.env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.local
    REDIS_USE_SENTINEL: "false"
    REDIS_URL: "redis://:${REDIS_PASSWORD:-}@redis:6379/1"
    CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:-}@redis:6379/0"
    CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD:-}@redis:6379/2"
    DB_HOST: postgres
    ES_URLS: "http://elasticsearch:9200"
    ES_USERNAME: ""
    ES_PASSWORD: ""
  volumes:
    # Hot-reload: mount source directories so code changes reflect immediately
    - ../apps:/app/apps
    - ../config:/app/config
    - ../static:/app/static
    - ../storages:/app/storages
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    elasticsearch:
      condition: service_healthy
  networks:
    - local-net

services:

  # ── Application ─────────────────────────────────────────────────────────────

  api:
    <<: *app-base
    container_name: job-platform-api-local
    ports:
      - "8000:8000"
    # runserver for hot-reload; entrypoint-server.sh (gunicorn) for closer-to-prod
    command: python manage.py runserver 0.0.0.0:8000

  celery:
    <<: *app-base
    container_name: job-platform-celery-local
    command: >
      celery -A config worker
      --loglevel=info
      --pool=threads
      --concurrency=4

  celery-beat:
    <<: *app-base
    container_name: job-platform-celery-beat-local
    command: >
      celery -A config beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
      --max-interval 10
    depends_on:
      - celery

  # ── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: bitnami/postgresql:14
    container_name: job-platform-postgres-local
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRESQL_USERNAME: ${DB_USER:-postgres}
      POSTGRESQL_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRESQL_DATABASE: ${DB_NAME:-job_platform_local}
    volumes:
      - pg_data_local:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local-net

  redis:
    image: redis:7-alpine
    container_name: job-platform-redis-local
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-}"
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_local:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning",
             "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local-net

  elasticsearch:
    image: elasticsearch:8.15.0
    container_name: job-platform-es-local
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - node.name=es-local
      - cluster.name=es-local-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data_local:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 8
    networks:
      - local-net

  redisinsight:
    image: redis/redisinsight:latest
    container_name: job-platform-redisinsight-local
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - local-net

networks:
  local-net:
    driver: bridge

volumes:
  pg_data_local:
  redis_data_local:
  es_data_local:

secrets:
  pip_conf:
    file: ../compose/secrets/pip.conf
